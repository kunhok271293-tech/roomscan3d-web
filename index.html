<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Đo Đạc Mô Hình 3D</title>
<style>
  :root { --bg:#1b1d21; --panel:#25282e; --line:#3a3e46; --text:#e8eaed; --muted:#9aa0a6; --accent:#ffb300; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  #view { position:relative; flex:1; min-width:0; }
  #view canvas { display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .dim-label { background:rgba(20,20,20,.88); color:#ff5a4d; border:1px solid #ff2d20; border-radius:4px;
    padding:2px 6px; font:600 13px system-ui,sans-serif; white-space:nowrap; }
  .dim-label.live { color:#ff8a80; border-color:#ff8a80; }
  .dim-label.scan { color:#9aa0a6; border-color:#9aa0a6; border-style:dashed; }
  #ask { display:none; position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:5; background:var(--panel);
    border:1px solid var(--accent); border-radius:8px; padding:14px; width:300px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #ask input { width:100%; font:600 20px system-ui; padding:8px; margin:8px 0; background:#15171a; color:var(--accent);
    border:1px solid var(--line); border-radius:6px; }
  #ask .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .row b { cursor:pointer; text-decoration:underline dotted; }
  .row b.scanned { color:var(--muted); }
  #toolbar { position:absolute; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px; }
  button, select, label.btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:7px 10px; font:inherit; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); }
  #side { width:280px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #side h3 { margin:0; padding:12px; font-size:14px; border-bottom:1px solid var(--line); }
  #list { flex:1; overflow:auto; padding:6px; }
  .row { display:flex; align-items:center; gap:6px; padding:6px; border-radius:6px; }
  .row:hover { background:#2f333a; }
  .row b { color:#ff5a4d; min-width:70px; }
  .row small { color:var(--muted); flex:1; font-size:11px; }
  .row button { padding:2px 8px; }
  #foot { padding:10px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; }
  #hint { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,.6); padding:6px 10px; border-radius:6px; color:var(--muted); font-size:12px; max-width:70%; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); font-size:20px; }
  #toast { display:none; position:absolute; left:10px; right:10px; top:60px; z-index:7; background:rgba(20,20,20,.92); color:#fff;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; pointer-events:none; }
  #toast.bad { border-color:#ff2d20; color:#ff8a80; }
  #bottom { display:none; }
  /* Giao diện điện thoại / máy tính bảng */
  .touch #app { height:100dvh; }
  .touch #hint { top:62px; bottom:auto; max-width:92%; pointer-events:none; }
  .touch #bottom { display:flex; position:absolute; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); gap:8px; }
  .touch #bottom button { min-height:50px; font-size:16px; }
  .touch #bTool { flex:1; font-weight:700; }
  .touch #bUnit { font-size:14px; white-space:nowrap; }
  .touch #toolbar { flex-wrap:nowrap; overflow-x:auto; right:10px; padding-bottom:2px; }
  .touch #toolbar > * { flex:none; min-height:40px; }
  .touch #side { position:absolute; left:0; right:0; bottom:0; top:auto; width:auto; height:60%; border-left:0;
    border-top:1px solid var(--line); border-radius:14px 14px 0 0; transform:translateY(100%); transition:.2s; z-index:6; }
  .touch #side.open { transform:none; }
  .touch .row button { min-height:36px; min-width:36px; }
  .touch .row b { font-size:16px; }
  .touch #foot button, .touch #foot label { min-height:40px; }
  #ask { width:min(320px, 92vw); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/build/three.module.js",
  "three/addons/": "./lib/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="labels"></div>
    <div id="toolbar">
      <label class="btn">Mở file 3D<input id="file" type="file" accept=".obj,.glb,.gltf,.usdz,.ply,.stl" hidden></label>
      <button id="bMeasure" class="on" title="Phím M">📏 Đo</button>
      <button id="bSnap" class="on" title="Phím S">🧲 Bám điểm</button>
      <select id="axis" title="Khoá trục (A/X/Y/Z)">
        <option value="auto">Trục: tự do</option><option value="x">Khoá X</option>
        <option value="y">Khoá Y (cao)</option><option value="z">Khoá Z</option>
      </select>
      <select id="unit"><option value="m">m</option><option value="cm" selected>cm</option><option value="mm">mm</option></select>
      <button id="bWire">Khung lưới</button>
      <button id="bFit">Căn khung</button>
    </div>
    <div id="hint">Bấm 2 điểm → nhập số đo thật (thước/laser) → nhãn dim hiện số thật. Bám điểm tự hút vào đỉnh/cạnh. Esc: huỷ · Ctrl+Z: hoàn tác · A/X/Y/Z: khoá trục</div>
    <div id="bottom">
      <button id="bUndo" title="Hoàn tác">↶</button>
      <button id="bUnit" title="Đổi đơn vị: cm → mm → m">Đơn vị: cm</button>
      <button id="bTool" class="on">📏 Đo</button>
      <button id="bList">☰ Danh sách (<span id="count2">0</span>)</button>
    </div>
    <div id="ask">
      <div><b>Nhập số đo thật</b> (đơn vị mặc định: <span id="askUnit"></span>)</div>
      <div id="askScan" style="color:var(--muted);font-size:12px"></div>
      <input id="askIn" inputmode="decimal" placeholder="vd 2650 hoặc 2.65m" autocomplete="off">
      <div class="btns">
        <button id="askOk" class="on">Ghi</button>
        <button id="askScanBtn">Dùng số quét</button>
        <button id="askCancel">Huỷ</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="drop">Thả file .obj / .usdz / .glb / .ply / .stl vào đây</div>
  </div>
  <div id="side">
    <h3>Kích thước đã đo (<span id="count">0</span>)</h3>
    <div id="list"></div>
    <div id="foot">
      <button id="bSaveJson" title="Sao lưu số đo ra file, không sợ mất khi xoá dữ liệu trình duyệt">Lưu số đo</button>
      <label class="btn">Mở số đo<input id="jsonIn" type="file" accept=".json" hidden></label>
      <button id="bCsv">Xuất CSV</button>
      <button id="bPng">Ảnh PNG</button>
      <button id="bClear">Xoá hết</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { USDZLoader } from 'three/addons/loaders/USDZLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from './lib/three-mesh-bvh.js';

// BVH: bắn tia nhanh hơn rất nhiều trên lưới LiDAR hàng trăm nghìn tam giác
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const $ = id => document.getElementById(id);
const view = $('view');
let dirty = true, lastRender = 0;      // vẽ lại khi cần (xem hàm loop)
function invalidate() { dirty = true; }

// ---------- scene ----------
const isCoarse = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: !isCoarse, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, matchMedia('(pointer:coarse)').matches ? 1.5 : 2));
view.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('labels') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 1000);
camera.position.set(6, 5, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;   // thả tay là dừng ngay, không trượt thêm
controls.zoomToCursor = true;     // zoom vào đúng chỗ đang trỏ để chọn điểm chính xác
controls.minDistance = 0.05;
// Điện thoại: lúc đang xoay/zoom hạ độ phân giải xuống 1x cho mượt, dừng tay 0,2 giây thì trả lại nét
const baseDPR = Math.min(devicePixelRatio, isCoarse ? 1.5 : 2);
let lowRes = false, restoreTimer = 0;
controls.addEventListener('change', () => {
  if (!isCoarse) return;
  if (!lowRes) { lowRes = true; renderer.setPixelRatio(1); }
  clearTimeout(restoreTimer);
  restoreTimer = setTimeout(() => { lowRes = false; renderer.setPixelRatio(baseDPR); invalidate(); }, 220);
});
scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(3, 8, 5);
scene.add(sun);
const grid = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
scene.add(grid);

const modelGroup = new THREE.Group();
scene.add(modelGroup);
const dimGroup = new THREE.Group();
scene.add(dimGroup);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- model loading ----------
const meshMat = () => new THREE.MeshLambertMaterial({ color:0xc9ccd1, side:THREE.DoubleSide, flatShading:true });
let wire = false;

function setModel(obj) {
  modelGroup.clear();
  clearDims(false);
  let sc = 1;
  try { sc = parseFloat(localStorage.getItem('scale:' + currentName)) || 1; } catch {}
  modelGroup.scale.setScalar(sc);
  modelGroup.updateMatrixWorld(true);
  obj.traverse(o => {
    if (o.isMesh) {
      // Lưới OBJ thường tách đỉnh theo từng tam giác (gấp ~6 lần). Gộp đỉnh trùng để nhẹ GPU hơn nhiều.
      if (!o.geometry.index && o.geometry.attributes.position.count > 30000) {
        o.geometry.deleteAttribute('normal'); o.geometry.deleteAttribute('uv');
        o.geometry = mergeVertices(o.geometry, 1e-5);
      }
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      const m = Array.isArray(o.material) ? o.material[0] : o.material;
      if (!m || !m.map) o.material = meshMat();
      else m.side = THREE.DoubleSide;
      o.geometry.computeBoundsTree();
    }
  });
  modelGroup.add(obj);
  fit();
  loadSaved();
  invalidate();
}

function fit() {
  const box = new THREE.Box3().setFromObject(modelGroup);
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) || 5;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(1, .8, 1).normalize().multiplyScalar(r * 1.6));
  camera.near = r / 500; camera.far = r * 50; camera.updateProjectionMatrix();
  grid.position.y = box.min.y;
}

function demoRoom() {
  // Phòng mẫu 4.2 x 2.6 x 3.1 m, chỉ để thử công cụ khi chưa có file quét
  const g = new THREE.Group();
  const room = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 3.1), new THREE.MeshStandardMaterial({ color:0xd8d2c4, side:THREE.BackSide, flatShading:true }));
  room.position.y = 1.3;
  const door = new THREE.Mesh(new THREE.BoxGeometry(.9, 2.05, .05), new THREE.MeshStandardMaterial({ color:0x8a5a2b }));
  door.position.set(-1, 1.025, 1.54);
  g.add(room, door);
  return g;
}

async function loadFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  currentName = file.name;
  toast('Đang đọc file ' + file.name + '… (file lớn có thể mất vài giây)');
  await new Promise(r => setTimeout(r, 30));      // cho trình duyệt kịp hiện thông báo
  try {
    let obj;
    if (ext === 'obj') obj = new OBJLoader().parse(await file.text());
    else if (ext === 'glb' || ext === 'gltf') {
      const data = ext === 'glb' ? await file.arrayBuffer() : await file.text();
      obj = await new Promise((res, rej) => new GLTFLoader().parse(data, '', g => res(g.scene), rej));
    } else if (ext === 'usdz') obj = new USDZLoader().parse(await file.arrayBuffer());
    else if (ext === 'ply') obj = new THREE.Mesh(new PLYLoader().parse(await file.arrayBuffer()));
    else if (ext === 'stl') obj = new THREE.Mesh(new STLLoader().parse(await file.arrayBuffer()));
    else throw new Error('Định dạng không hỗ trợ');
    setModel(obj);
    let meshes = 0, tris = 0;
    modelGroup.traverse(o => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
    const box = new THREE.Box3().setFromObject(modelGroup), s = box.getSize(new THREE.Vector3());
    if (!meshes || box.isEmpty() || !isFinite(s.x)) {
      toast('Không đọc được hình 3D trong file "' + file.name + '". Với Quét phòng, hãy dùng file OBJ thay vì USDZ.', true);
    } else {
      toast(file.name + ': ' + meshes + ' khối, ' + Math.round(tris) + ' tam giác, kích thước ' +
        s.x.toFixed(2) + ' × ' + s.y.toFixed(2) + ' × ' + s.z.toFixed(2) + ' m');
    }
  } catch (e) { toast('Không đọc được file: ' + e.message, true); }
}
let toastTimer;
function toast(msg, bad = false) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
  t.style.display = 'block'; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, bad ? 15000 : 6000);
}
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });
addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').style.display = 'none'; });
addEventListener('drop', e => {
  e.preventDefault(); $('drop').style.display = 'none';
  const f = e.dataTransfer.files[0]; if (f) loadFile(f);
});

// ---------- measuring ----------
let currentName = 'phong-mau';
let unit = 'cm', snapOn = true, measureOn = true, axisLock = 'auto';
let dims = [];          // {a,b,group,label}
let first = null;       // điểm đầu đang chờ điểm thứ hai
const raycaster = new THREE.Raycaster();
raycaster.firstHitOnly = true;
const ndc = new THREE.Vector2();

const cursor = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color:0x00e5ff, depthTest:false }));
cursor.userData.px = 4; cursor.renderOrder = 10; cursor.visible = false; scene.add(cursor);
const liveLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color:0xff8a80, depthTest:false }));
liveLine.renderOrder = 9; liveLine.visible = false; scene.add(liveLine);
const liveLabelEl = document.createElement('div'); liveLabelEl.className = 'dim-label live';
const liveLabel = new CSS2DObject(liveLabelEl); liveLabel.visible = false; scene.add(liveLabel);
const markers = [cursor];

function fmt(d) {
  if (unit === 'm') return d.toFixed(3) + ' m';
  if (unit === 'cm') return (d * 100).toFixed(1) + ' cm';
  return Math.round(d * 1000) + ' mm';
}
const num = d => unit === 'm' ? d.toFixed(3) : unit === 'cm' ? (d * 100).toFixed(1) : String(Math.round(d * 1000));

function toScreen(v) {
  const p = v.clone().project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2((p.x + 1) / 2 * r.width, (1 - p.y) / 2 * r.height);
}

// Bám góc/cạnh bằng MẶT PHẲNG: lưới LiDAR hiếm khi có đỉnh đúng ở góc tường, nên ta lấy các tam giác quanh
// con trỏ, gom thành tối đa 3 mặt phẳng (tường/sàn/trần), rồi tính giao điểm (góc) hoặc giao tuyến (cạnh).
const _sph = new THREE.Sphere(), _inv = new THREE.Matrix4();
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3(), _e1 = new THREE.Vector3(), _e2 = new THREE.Vector3();
function featureSnap(hit) {
  const mesh = hit.object, bvh = mesh.geometry.boundsTree;
  if (!bvh) return null;
  const k = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / (renderer.domElement.clientHeight || 1);
  const R = THREE.MathUtils.clamp(camera.position.distanceTo(hit.point) * k * 24, 0.015, 0.6);   // ~24 px, tính bằng mét
  _inv.copy(mesh.matrixWorld).invert();
  _sph.center.copy(hit.point).applyMatrix4(_inv);
  _sph.radius = R / (mesh.matrixWorld.getMaxScaleOnAxis() || 1);
  const tris = []; let totalArea = 0;
  bvh.shapecast({
    intersectsBounds: box => _sph.intersectsBox(box),
    intersectsTriangle: tri => {
      _a.copy(tri.a).applyMatrix4(mesh.matrixWorld); _b.copy(tri.b).applyMatrix4(mesh.matrixWorld); _c.copy(tri.c).applyMatrix4(mesh.matrixWorld);
      const cen = _a.clone().add(_b).add(_c).multiplyScalar(1 / 3);
      if (cen.distanceTo(hit.point) > R * 1.3) return false;
      const n = _e1.subVectors(_b, _a).cross(_e2.subVectors(_c, _a));
      const area = n.length() / 2;
      if (area < 1e-9) return false;
      tris.push({ n: n.clone().normalize(), cen, area }); totalArea += area;
      return tris.length > 3000;      // true = dừng duyệt
    },
  });
  if (tris.length < 3) return null;

  // gom các tam giác cùng hướng (lệch < 25°) thành mặt phẳng, mặt lớn nhất trước
  tris.sort((x, y) => y.area - x.area);
  let rest = tris; const planes = [];
  for (let it = 0; it < 3 && rest.length; it++) {
    let N = rest[0].n.clone(), mem = [];
    for (let r = 0; r < 3; r++) {
      mem = rest.filter(t => Math.abs(t.n.dot(N)) > 0.906);
      const sum = new THREE.Vector3();
      for (const t of mem) sum.addScaledVector(t.n, t.area * (t.n.dot(N) < 0 ? -1 : 1));
      if (sum.lengthSq() > 0) N = sum.normalize();
    }
    let area = 0; const P = new THREE.Vector3();
    for (const t of mem) { area += t.area; P.addScaledVector(t.cen, t.area); }
    if (area < totalArea * 0.12) break;
    planes.push({ N, P: P.multiplyScalar(1 / area), d: 0, area });
    planes[planes.length - 1].d = N.dot(planes[planes.length - 1].P);
    const set = new Set(mem); rest = rest.filter(t => !set.has(t));
  }
  if (planes.length < 2) return null;

  if (planes.length >= 3) {          // góc = giao điểm của 3 mặt phẳng
    const [p1, p2, p3] = planes;
    const c23 = new THREE.Vector3().crossVectors(p2.N, p3.N), c31 = new THREE.Vector3().crossVectors(p3.N, p1.N), c12 = new THREE.Vector3().crossVectors(p1.N, p2.N);
    const det = p1.N.dot(c23);
    if (Math.abs(det) > 0.25) {
      const P = c23.multiplyScalar(p1.d).add(c31.multiplyScalar(p2.d)).add(c12.multiplyScalar(p3.d)).multiplyScalar(1 / det);
      if (P.distanceTo(hit.point) < R * 1.4) return { p: P, kind: 'vertex' };
    }
  }
  // cạnh = giao tuyến của 2 mặt phẳng, chiếu con trỏ lên đường đó
  for (let i = 0; i < planes.length; i++) for (let j = i + 1; j < planes.length; j++) {
    const p1 = planes[i], p2 = planes[j];
    const D = new THREE.Vector3().crossVectors(p1.N, p2.N), l2 = D.lengthSq();
    if (l2 < 0.25) continue;                           // hai mặt gần song song (< 30°)
    const P0 = new THREE.Vector3().crossVectors(p2.N, D).multiplyScalar(p1.d)
      .add(new THREE.Vector3().crossVectors(D, p1.N).multiplyScalar(p2.d)).multiplyScalar(1 / l2);
    const Dn = D.normalize();
    const P = P0.addScaledVector(Dn, hit.point.clone().sub(P0).dot(Dn));
    if (P.distanceTo(hit.point) < R) return { p: P, kind: 'edge' };
  }
  return null;
}

function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  ndc.set(mx / r.width * 2 - 1, -(my / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(modelGroup.children, true).find(h => h.face);
  if (!hit) return null;
  let p = hit.point.clone(), kind = 'face';
  if (snapOn) { const f = featureSnap(hit); if (f) return f; }
  // Lưới LiDAR thô (hàng trăm nghìn tam giác): chỉ bám góc/cạnh bằng mặt phẳng ở trên; lưới sạch mới bám đỉnh tam giác
  const geoOf = hit.object.geometry;
  if (snapOn && (geoOf.index ? geoOf.index.count : geoOf.attributes.position.count) / 3 < 20000) {
    const mesh = hit.object, pos = mesh.geometry.attributes.position;
    const vs = [hit.face.a, hit.face.b, hit.face.c].map(i =>
      new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld));
    const m = new THREE.Vector2(mx, my);
    const SNAP_V = matchMedia('(pointer:coarse)').matches ? 14 : 9, SNAP_E = SNAP_V * 0.7;
    let best = SNAP_V, bp = null;
    for (const v of vs) { const d = toScreen(v).distanceTo(m); if (d < best) { best = d; bp = v; } }
    if (bp) { p = bp; kind = 'vertex'; }
    else {
      let be = SNAP_E, ep = null;
      for (let i = 0; i < 3; i++) {
        const A = vs[i], B = vs[(i + 1) % 3], sa = toScreen(A), sb = toScreen(B);
        const ab = sb.clone().sub(sa), L = ab.lengthSq();
        if (!L) continue;
        const t = THREE.MathUtils.clamp(m.clone().sub(sa).dot(ab) / L, 0, 1);
        const d = sa.clone().addScaledVector(ab, t).distanceTo(m);
        if (d < be) { be = d; ep = A.clone().lerp(B, t); }
      }
      if (ep) { p = ep; kind = 'edge'; }
    }
  }
  return { p, kind };
}

function applyLock(p) {
  if (!first || axisLock === 'auto') return p;
  const ax = new THREE.Vector3(axisLock === 'x' ? 1 : 0, axisLock === 'y' ? 1 : 0, axisLock === 'z' ? 1 : 0);
  return first.clone().addScaledVector(ax, p.clone().sub(first).dot(ax));
}

// Chấm có kích thước cố định theo pixel trên màn hình, không to lên khi zoom ra
function scaleMarkers() {
  const k = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / (renderer.domElement.clientHeight || 1);
  for (const m of markers) m.scale.setScalar(camera.position.distanceTo(m.position) * k * (m.userData.px || 3));
}

const touchMode = matchMedia('(pointer:coarse)').matches;
if (touchMode) document.documentElement.classList.add('touch');

view.addEventListener('pointermove', ev => {
  if (!touchMode) hover(ev);
  else if (g && pts.size === 1) {
    if (Math.hypot(ev.clientX - g.x, ev.clientY - g.y) > 8) g.dragged = true;
    hover(g.dragged ? off(ev) : ev);
  }
});
function hover(ev) {
  if (!measureOn) return;
  const h = pick(ev);
  if (!h) { cursor.visible = false; liveLine.visible = false; liveLabel.visible = false; return; }
  const p = applyLock(h.p);
  cursor.position.copy(p); cursor.visible = true;
  cursor.material.color.set(h.kind === 'vertex' ? 0x00e676 : h.kind === 'edge' ? 0xffab00 : 0x00e5ff);
  if (first) {
    liveLine.geometry.setFromPoints([first, p]); liveLine.visible = true;
    liveLabel.position.copy(first).lerp(p, .5);
    liveLabelEl.textContent = fmt(first.distanceTo(p)); liveLabel.visible = true;
  }
}

// Trên điện thoại: chạm giữ điểm 1 → kéo ngón tay sang điểm 2 → thả ra. Dấu chấm hiện cao hơn ngón tay
// một đoạn để ngón không che điểm. Chạm 1 lần rồi chạm lần nữa cũng được. Hai ngón: di chuyển/zoom.
const OFFSET = 70, pts = new Set();
let g = null;
const off = ev => ({ clientX: ev.clientX, clientY: ev.clientY - OFFSET });
const hideLive = () => { liveLine.visible = false; liveLabel.visible = false; };
const firstMarker = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshBasicMaterial({ color:0xff1f1f, depthTest:false }));
firstMarker.userData.px = 3.5; firstMarker.renderOrder = 10; firstMarker.visible = false; scene.add(firstMarker); markers.push(firstMarker);
const HINT_IDLE = 'Chạm điểm 1, rồi chạm điểm 2 (hoặc chạm giữ điểm 1 và kéo sang điểm 2). Hai ngón: di chuyển/zoom. Muốn xoay: bấm nút "Đang đo".';
const HINT_FIRST = 'Đã chọn điểm 1. Dùng hai ngón di chuyển/zoom tới điểm 2 rồi chạm vào điểm đó.';
let hintFirst = null, hintHideAt = Date.now() + 9000;
function syncFirstMarker() {
  firstMarker.visible = !!first; if (first) firstMarker.position.copy(first);
  if (!touchMode || hintFirst === !!first) return;
  hintFirst = !!first;
  $('hint').textContent = hintFirst ? HINT_FIRST : HINT_IDLE;
  $('hint').style.display = hintFirst || Date.now() < hintHideAt ? 'block' : 'none';
}

view.addEventListener('pointerdown', ev => {
  if (!touchMode || ev.pointerType === 'mouse' || ev.target.closest('#toolbar,#bottom,#ask,#side')) return;
  pts.add(ev.pointerId);
  if (pts.size > 1) { if (g && !g.hadFirst) first = null; g = null; hideLive(); cursor.visible = false; return; }
  if (!measureOn || askCtx) return;
  g = { x: ev.clientX, y: ev.clientY, hadFirst: !!first };
  if (!first) {
    const h = pick(ev);               // điểm 1 = đúng chỗ ngón chạm
    if (!h) { g = null; return; }
    first = h.p.clone();
  }
  hover(ev);
});
function endTouch(ev) {
  if (!touchMode || ev.pointerType === 'mouse') return;
  pts.delete(ev.pointerId);
  if (!g) return;
  const gg = g; g = null;
  cursor.visible = false;
  if (ev.type === 'pointercancel') { if (!gg.hadFirst) first = null; hideLive(); return; }
  const moved = Math.hypot(ev.clientX - gg.x, ev.clientY - gg.y);
  if (!gg.hadFirst && moved < 8) { hideLive(); return; }   // chạm 1 lần: giữ điểm 1, chạm tiếp để chọn điểm 2
  const h = pick(gg.dragged ? off(ev) : ev);   // chạm nhẹ: đúng chỗ ngón; kéo: dấu chấm cao hơn ngón
  const p = h && first ? applyLock(h.p) : null;
  if (p && first.distanceTo(p) > 1e-4) { const a = first; first = null; hideLive(); ask(a, p.clone()); }
  else if (!gg.hadFirst) { first = null; hideLive(); }
  else hideLive();
}
view.addEventListener('pointerup', endTouch);
view.addEventListener('pointercancel', endTouch);

let down = null;
view.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY }; });
view.addEventListener('pointerup', ev => {
  if (touchMode) { down = null; return; }
  if (!down || !measureOn || askCtx || ev.target.closest('#toolbar') || ev.target.closest('#ask')) { down = null; return; }
  const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y); down = null;
  if (moved > 5) return;
  placeAt(ev);
});
function placeAt(ev) {
  if (!measureOn || askCtx) return;
  const h = pick(ev); if (!h) return;
  const p = applyLock(h.p);
  if (!first) { first = p.clone(); }
  else {
    const a = first.clone();
    first = null; liveLine.visible = false; liveLabel.visible = false;
    if (a.distanceTo(p) > 1e-4) ask(a, p.clone());
  }
}
$('bUndo').onclick = () => { if (first) { first = null; liveLine.visible = liveLabel.visible = false; } else if (dims.length) removeDim(dims.length - 1); };

// ---------- nhập số đo thật ----------
let askCtx = null;
function parseLen(s) {
  const m = s.trim().replace(',', '.').match(/^([\d.]+)\s*(mm|cm|m)?$/i);
  if (!m) return NaN;
  const v = parseFloat(m[1]), u = (m[2] || unit).toLowerCase();
  return u === 'mm' ? v / 1000 : u === 'cm' ? v / 100 : v;
}
function ask(a, b, idx = null) {
  askCtx = { a, b, idx };
  $('askScan').textContent = 'Số quét được: ' + fmt(a.distanceTo(b)) + ' (chỉ để tham khảo)';
  $('askUnit').textContent = unit;
  $('askIn').value = idx != null && dims[idx].real != null ? num(dims[idx].real) : '';
  $('ask').style.display = 'block';
  setTimeout(() => $('askIn').focus(), 0);
}
function closeAsk() { $('ask').style.display = 'none'; askCtx = null; }
function commitAsk(useScan) {
  const { a, b, idx } = askCtx;
  let real = null;
  if (!useScan) {
    real = parseLen($('askIn').value);
    if (!(real > 0)) { $('askIn').focus(); return; }
  }
  if (idx == null) addDim(a, b, real); else { dims[idx].real = real; refresh(true); }
  closeAsk();
}
$('askOk').onclick = () => commitAsk(false);
$('askScanBtn').onclick = () => commitAsk(true);
$('askCancel').onclick = closeAsk;
$('askIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') commitAsk(false);
  else if (e.key === 'Escape') closeAsk();
});

const valueOf = d => d.real ?? d.a.distanceTo(d.b);

function calibrate(i) {
  const d = dims[i];
  if (d.real == null) return;
  const k = d.real / d.a.distanceTo(d.b);
  if (!isFinite(k) || Math.abs(k - 1) < 1e-6) return;
  if (!confirm(`Chỉnh tỉ lệ cả mô hình ×${k.toFixed(4)} theo số đo này?\nCác số đo thật đã nhập giữ nguyên.`)) return;
  const saved = dims.map(x => ({ a: x.a.clone().multiplyScalar(k), b: x.b.clone().multiplyScalar(k), real: x.real }));
  clearDims(false);
  modelGroup.scale.multiplyScalar(k);
  modelGroup.updateMatrixWorld(true);
  saved.forEach(s => addDim(s.a, s.b, s.real, false));
  fit();
  try { localStorage.setItem('scale:' + currentName, String(modelGroup.scale.x)); } catch {}
  refresh(true);
}

function addDim(a, b, real = null, save = true) {
  const group = new THREE.Group();
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color:0xff1f1f, depthTest:false }));
  line.renderOrder = 8; group.add(line);
  for (const q of [a, b]) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshBasicMaterial({ color:0xff1f1f, depthTest:false }));
    s.position.copy(q); s.renderOrder = 8; group.add(s); markers.push(s); s.userData.dim = true; s.userData.px = 3;
  }
  const el = document.createElement('div'); el.className = 'dim-label';
  const label = new CSS2DObject(el); label.position.copy(a).lerp(b, .5); group.add(label);
  dimGroup.add(group);
  dims.push({ a, b, real, group, el });
  refresh(save);
}

function removeDim(i) {
  if (dims[i].real != null && !confirm('Xoá số đo thật ' + fmt(dims[i].real) + '?')) return;
  const d = dims.splice(i, 1)[0];
  d.group.traverse(o => { const k = markers.indexOf(o); if (k >= 0) markers.splice(k, 1); });
  dimGroup.remove(d.group);
  d.el.remove();
  refresh(true);
}
function clearDims(save = true) {
  while (dims.length) { const d = dims.pop(); d.group.traverse(o => { const k = markers.indexOf(o); if (k >= 0) markers.splice(k, 1); }); dimGroup.remove(d.group); d.el.remove(); }
  first = null; liveLine.visible = false; liveLabel.visible = false;
  refresh(save);
}

function refresh(save = true) {
  const list = $('list'); list.innerHTML = '';
  dims.forEach((d, i) => {
    const scan = d.a.distanceTo(d.b);
    d.el.textContent = fmt(valueOf(d)) + (d.real == null ? ' (quét)' : '');
    d.el.classList.toggle('scan', d.real == null);
    const row = document.createElement('div'); row.className = 'row';
    const diff = d.real == null ? 'chưa nhập số thật' : `quét ${fmt(scan)} · lệch ${((scan - d.real) * 1000).toFixed(0)} mm`;
    row.innerHTML = `<span>${i + 1}.</span><b class="${d.real == null ? 'scanned' : ''}" title="Bấm để nhập/sửa số đo thật">${fmt(valueOf(d))}</b><small>${diff}</small>`;
    row.querySelector('b').onclick = () => ask(d.a, d.b, i);
    if (d.real != null) {
      const k = document.createElement('button'); k.textContent = '⚖'; k.title = 'Chỉnh tỉ lệ mô hình theo số đo này';
      k.onclick = () => calibrate(i); row.append(k);
    }
    const x = document.createElement('button'); x.textContent = '✕'; x.onclick = () => removeDim(i);
    row.append(x); list.append(row);
  });
  $('count').textContent = dims.length;
  $('count2').textContent = dims.length;
  if (save) persist();
}

// ---------- lưu tự động theo tên file ----------
const key = () => 'dims:' + currentName;
function persist() {
  try { localStorage.setItem(key(), JSON.stringify(dims.map(d => [d.a.toArray(), d.b.toArray(), d.real]))); } catch {}
}
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(key()) || '[]');
    for (const [a, b, real] of s) addDim(new THREE.Vector3(...a), new THREE.Vector3(...b), real ?? null, false);
  } catch {}
}

// ---------- xuất ----------
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('bSaveJson').onclick = () => {
  const data = { file: currentName, scale: modelGroup.scale.x,
    dims: dims.map(d => ({ a: d.a.toArray(), b: d.b.toArray(), real: d.real })) };
  download(currentName.replace(/\.[^.]+$/, '') + '-sodo.json', new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }));
};
$('jsonIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    clearDims(false);
    modelGroup.scale.setScalar(data.scale || 1); modelGroup.updateMatrixWorld(true);
    for (const d of data.dims) addDim(new THREE.Vector3(...d.a), new THREE.Vector3(...d.b), d.real ?? null, false);
    try { localStorage.setItem('scale:' + currentName, String(modelGroup.scale.x)); } catch {}
    refresh(true);
  } catch (err) { alert('File số đo không hợp lệ'); }
  e.target.value = '';
});
$('bCsv').onclick = () => {
  const rows = ['STT,Số đo (mm),Nguồn,Số quét (mm),Lệch quét-thật (mm)'];
  dims.forEach((d, i) => {
    const S = Math.round(d.a.distanceTo(d.b) * 1000);
    rows.push([i + 1, Math.round(valueOf(d) * 1000), d.real == null ? 'quét' : 'đo thật', S,
      d.real == null ? '' : S - Math.round(d.real * 1000)].join(','));
  });
  download('kich-thuoc.csv', new Blob(['﻿' + rows.join('\n')], { type:'text/csv' }));
};
$('bPng').onclick = () => {
  renderer.render(scene, camera);
  renderer.domElement.toBlob(b => download('mo-hinh.png', b));
};
$('bClear').onclick = () => { if (dims.length && confirm('Xoá toàn bộ kích thước?')) clearDims(); };

// ---------- UI ----------
function setToggle(btn, on) { btn.classList.toggle('on', on); }
function setMeasure(on) {
  measureOn = on;
  setToggle($('bMeasure'), on); setToggle($('bTool'), on);
  $('bTool').textContent = on ? '📏 Đo' : '✋ Xoay';
  if (touchMode) controls.touches.ONE = on ? -1 : THREE.TOUCH.ROTATE;   // đo: 1 ngón để đo; xoay: 1 ngón để xoay
  if (!on) { first = null; g = null; cursor.visible = liveLine.visible = liveLabel.visible = false; }
}
$('bMeasure').onclick = () => setMeasure(!measureOn);
$('bTool').onclick = () => setMeasure(!measureOn);
if (touchMode) {
  setMeasure(true);
  setTimeout(() => { if (!first) $('hint').style.display = 'none'; }, 9000);
}
$('bSnap').onclick = () => { snapOn = !snapOn; setToggle($('bSnap'), snapOn); };
$('axis').onchange = e => { axisLock = e.target.value; };
function setUnit(u) {
  unit = u; $('unit').value = u; $('bUnit').textContent = 'Đơn vị: ' + u;
  refresh(false); invalidate();
}
$('unit').onchange = e => setUnit(e.target.value);
$('bUnit').onclick = () => setUnit({ cm: 'mm', mm: 'm', m: 'cm' }[unit]);
setUnit(unit);
$('bWire').onclick = () => { wire = !wire; setToggle($('bWire'), wire); modelGroup.traverse(o => { if (o.isMesh && o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.wireframe = wire); }); };
$('bFit').onclick = fit;
$('bList').onclick = () => $('side').classList.toggle('open');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { first = null; liveLine.visible = liveLabel.visible = false; }
  else if (k === 'z' && (e.ctrlKey || e.metaKey)) { if (first) first = null; else if (dims.length) removeDim(dims.length - 1); }
  else if (k === 's') $('bSnap').click();
  else if (k === 'm') $('bMeasure').click();
  else if (['a', 'x', 'y', 'z'].includes(k) && !e.ctrlKey && !e.metaKey) {
    axisLock = k === 'a' ? 'auto' : k; $('axis').value = axisLock;
  }
});

// ---------- loop ----------
// Chỉ vẽ lại khi có thay đổi (xoay/zoom/chạm/đo) để máy không nóng và không giật
['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'wheel', 'keydown', 'click', 'resize'].forEach(t =>
  addEventListener(t, invalidate, { passive: true, capture: true }));
function loop(now = 0) {
  const moved = controls.update();
  syncFirstMarker();
  if (moved || dirty || now - lastRender > 400) {
    scaleMarkers();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    dirty = false; lastRender = now;
  }
  requestAnimationFrame(loop);
}
resize();
setModel(demoRoom());
loop();
</script>
</body>
</html>
